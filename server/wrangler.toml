name = "carelogue-explain"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Fill these in before the first deploy (see README.md).
[vars]
BUNDLE_ID = "ca.carelogue.app"
PRODUCT_IDS = "ca.carelogue.app.plus.monthly"
# The DeepSeek model id exactly as deepinfra.com/models lists it.
DEEPINFRA_MODEL = "deepseek-ai/DeepSeek-V4.1-Flash"
# shasum -a 256 of Apple Root CA G3 in DER form — see README.
APPLE_ROOT_CA_G3_SHA256 = "63343abfb89a6a03ebb57e9b3f5fa7be7c4f5c756f3017b3a8c488c3653e9179"
# "1" during testing and App Review (reviewers buy via sandbox); revisit after launch — never turn it off before review.
ALLOW_SANDBOX = "1"
# Development only: point the provider call at any OpenAI-compatible endpoint
# (`wrangler dev --var PROVIDER_ENDPOINT:... --var DEEPINFRA_API_KEY:...`), so
# the whole chain can be exercised locally. Unset here, which means DeepInfra.
PER_DEVICE_LIMIT = "40"
PER_IP_LIMIT = "120"
WINDOW_SECONDS = "3600"

# Rate-limit counters. Create with:
#   npx wrangler kv namespace create RATE_LIMIT
# then paste the id below. Without the binding the service still runs, unlimited.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "eced6d50e1d3463a8f7ed888d2385b82"

# The site's text pages are bundled as text (docs/legal/*.md and
# docs/web/*.md) and rendered by the Worker at carelogue.ca/privacy, /terms
# and /support.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Custom domains, added after the zone is on Cloudflare. One Worker answers
# both: the API on its own subdomain, the policy pages on the root domain.
[[routes]]
pattern = "api.carelogue.ca/v1/*"
zone_name = "carelogue.ca"

[[routes]]
pattern = "carelogue.ca/privacy"
zone_name = "carelogue.ca"

[[routes]]
pattern = "carelogue.ca/terms"
zone_name = "carelogue.ca"

[[routes]]
pattern = "carelogue.ca/support"
zone_name = "carelogue.ca"

[[routes]]
pattern = "carelogue.ca/"
zone_name = "carelogue.ca"

# Secrets, never in this file:
#   npx wrangler secret put DEEPINFRA_API_KEY
#
# Internal channel (T30), optional. While set, a request whose bearer token
# equals this secret skips the App Store check (the rate limit still applies),
# which is how Debug builds are dogfooded before the subscription is on sale.
# At least 24 characters. Remove it before the public launch — a T37 checklist
# item:
#   npx wrangler secret put INTERNAL_ACCESS_KEY
#   npx wrangler secret delete INTERNAL_ACCESS_KEY
